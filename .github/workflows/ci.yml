name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :model:test :server:test :app:testDebugUnitTest \
            :app:assembleDebug :app:assembleRelease :server:exportStaticApi 2>&1 | tee build.log
      - name: Annotate failures
        if: failure()
        run: python3 .github/scripts/annotate.py build.log
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for p in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)) + int(r.get("errors", 0))
          print(f"::notice::{t} tests, {f} failed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spindle-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

  device:
    # Runs the app on an Android emulator against the local Ktor server and the
    # real Wikimedia media, and keeps screenshots of each step.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build server and test APKs
        run: ./gradlew --no-daemon :server:installDist :app:assembleDebug :app:assembleDebugAndroidTest -Pspindle.apiBaseUrl=http://10.0.2.2:8080/api/ 2>&1 | tee build.log
      - name: Start catalog server
        run: |
          nohup server/build/install/server/bin/server catalog/catalog.json > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
      - name: Run UI test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # The default options include -noaudio, which leaves ExoPlayer without an audio output.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pspindle.apiBaseUrl=http://10.0.2.2:8080/api/ > device.log 2>&1; echo $? > device.status
            adb pull /sdcard/Android/data/com.mileszhang.spindle/files/screens screens || true
            adb logcat -d > logcat.txt || true
            exit $(cat device.status)
      - name: Annotate failures
        if: failure()
        run: |
          python3 .github/scripts/annotate.py device.log || true
          python3 .github/scripts/annotate.py build.log || true
          grep -iE "ExoPlayer|AudioTrack|PlaybackException|MediaSession|MediaController|FATAL|spindle" logcat.txt | grep -v TestRunner | head -40 | cut -c1-300 | sed 's/^/::warning::/' || true
      - name: Screenshot summary
        if: always()
        run: ls -la screens || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens
          if-no-files-found: ignore
