name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :model:test :server:test :app:testDebugUnitTest \
            :app:assembleDebug :app:assembleRelease :server:exportStaticApi 2>&1 | tee build.log
      - name: Annotate failures
        if: failure()
        run: python3 .github/scripts/annotate.py build.log
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for p in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)) + int(r.get("errors", 0))
          print(f"::notice::{t} tests, {f} failed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spindle-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

  device:
    permissions:
      contents: write # pushes screenshots to the ci-screens branch
    # Runs the app on an Android emulator against the local Ktor server and the
    # real Wikimedia media, and keeps screenshots of each step.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build server and test APKs
        run: ./gradlew --no-daemon :server:installDist :app:assembleDebug :app:assembleDebugAndroidTest -Pspindle.apiBaseUrl=http://10.0.2.2:8080/api/ 2>&1 | tee build.log
      - name: Start catalog server
        run: |
          nohup server/build/install/server/bin/server catalog/catalog.json > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
      - name: Run UI test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6 # 1080x2400; the runner's default device is a 320x640 screen
          ram-size: 4096M
          disable-animations: true
          # The default options include -noaudio, which leaves ExoPlayer without an audio output.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pspindle.apiBaseUrl=http://10.0.2.2:8080/api/ -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > device.log 2>&1; echo $? > device.status
            adb exec-out run-as com.mileszhang.spindle tar -cf - -C files screens > screens.tar; tar -xf screens.tar || head -c 300 screens.tar
            adb logcat -d > logcat.txt || true
            exit $(cat device.status)
      - name: Annotate failures
        if: failure()
        run: |
          python3 .github/scripts/annotate.py device.log || true
          python3 .github/scripts/annotate.py build.log || true
          grep -E "SpindlePlayback|AndroidRuntime" logcat.txt | head -25 | cut -c1-400 | sed 's/^/::warning::/' || true
          grep -iE "ExoPlayer|AudioTrack|PlaybackException|MediaCodec" logcat.txt | head -15 | cut -c1-400 | sed 's/^/::warning::/' || true
      - name: Screenshot summary
        if: always()
        run: |
          echo "::notice::screens captured: $(ls screens 2>/dev/null | tr '\n' ' ') tar=$(stat -c %s screens.tar 2>/dev/null)"
      - name: Publish screenshots to the ci-screens branch
        if: always() && github.event_name == 'push'
        run: |
          [ -n "$(ls screens 2>/dev/null)" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/shots && cp screens/*.png /tmp/shots/
          git fetch origin ci-screens || true
          git checkout --orphan ci-screens-new
          git rm -rqf . && git clean -fdq
          cp /tmp/shots/*.png .
          echo "Screenshots from the emulator UI test, commit ${GITHUB_SHA}" > README.md
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -f origin HEAD:ci-screens
